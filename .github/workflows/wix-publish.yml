name: Publish to Wix

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Authenticate Wix CLI
        run: npm run wix -- login --api-key ${{ secrets.WIX_CLI_API_KEY }}

      - name: Publish site
        run: npm run wix -- publish
